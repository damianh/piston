name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Piston.slnx -c Release
      - name: Test
        run: dotnet test Piston.slnx -c Release --no-build

  smoke:
    name: Smoke test samples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Pack the tool
        run: dotnet pack src/Piston/Piston.csproj -c Release -o artifacts
      - name: Install the packed tool
        run: dotnet tool install Piston --tool-path .tools --source artifacts
      - name: Run the samples through Piston
        # samples/Samples.slnx: MSTest, NUnit, xUnit v3 and TUnit on Microsoft.Testing.Platform, 3 tests each
        # (1 passing, 1 deliberately failing, 1 skipped). The daemon builds, discovers and runs them; the startup
        # run's counts must match exactly.
        shell: bash
        run: >-
          node eng/smoke-test.mjs
          --tool ${{ runner.os == 'Windows' && '.tools/piston.exe' || '.tools/piston' }}
          --total 12 --failed 4 --skipped 4 --projects 4
          -- samples/Samples.slnx

  check-formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Piston.slnx
      - name: Check formatting
        run: dotnet format Piston.slnx --verify-no-changes --no-restore
