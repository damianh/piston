name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet run build.cs -- build
      - name: Test
        run: dotnet run build.cs -- test --skip-dependencies

  smoke:
    name: Smoke test samples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Pack and install the tool
        run: dotnet run build.cs -- install-tool
      - name: Test macOS worktree identity
        if: runner.os == 'macOS'
        run: dotnet test --project tests/Piston.Engine.Tests -c Release --filter-class Piston.Engine.Tests.Execution.WorktreeOwnershipTests
      - name: Run the samples through piston daemon
        # samples/Samples.slnx: MSTest, NUnit, xUnit v3 and TUnit on Microsoft.Testing.Platform, 3 tests each
        # (1 passing, 1 deliberately failing, 1 skipped). The startup run's counts must match exactly.
        run: dotnet run build.cs -- smoke-daemon --skip-dependencies
      - name: Verify the samples through piston mcp
        # An MCP client calls verify over stdio; it must report TestsFailed for a completed full-scope run with the
        # same counts.
        run: dotnet run build.cs -- smoke-mcp --skip-dependencies

  check-formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Check formatting
        run: dotnet run build.cs -- check-formatting
