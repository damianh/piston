name: Release tool

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet version to package (e.g. 0.1.0)"
        required: true
      publish_to_nuget:
        description: "Publish to NuGet.org (requires package ownership and NUGET_API_KEY)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build Piston.slnx -c Release
      - run: dotnet test Piston.slnx -c Release --no-build

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Determine version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid NuGet version: $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Pack framework-dependent tool
        run: dotnet pack src/Piston/Piston.csproj -c Release -p:Version="$VERSION" -o packages
      - name: Install isolated package and check CLI, web assets and HTTP MCP
        run: |
          dotnet tool install Piston --version "$VERSION" --tool-path "$RUNNER_TEMP/piston-tool" \
            --source "$PWD/packages" --no-cache
          python3 .github/scripts/smoke-tool.py "$RUNNER_TEMP/piston-tool/piston"
      - uses: actions/upload-artifact@v4
        with:
          name: piston-nuget-tool
          path: packages/*.nupkg
          if-no-files-found: error
      - name: Attach tool package to GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" packages/*.nupkg
      - name: Publish tool to NuGet.org
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_nuget
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Publishing requires package ownership and the NUGET_API_KEY secret."
            exit 1
          fi
          dotnet nuget push "packages/*.nupkg" --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"
