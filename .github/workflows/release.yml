name: Release tool

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet version to package (e.g. 0.1.0)"
        required: true
      publish_to_nuget:
        description: "Publish to NuGet.org (requires package ownership and Trusted Publishing setup)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build Piston.slnx -c Release
      - run: dotnet test Piston.slnx -c Release --no-build

  distribution:
    name: Distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet run build.cs -- smoke-distribution

  package:
    needs: [test, distribution]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Determine version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid NuGet version: $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Pack framework-dependent tool
        run: dotnet pack src/Piston/Piston.csproj -c Release -p:Version="$VERSION" -o packages
      - name: Check package contents
        env:
          PISTON_PACKAGES: packages
        run: dotnet run build.cs -- check-package
      - name: Install isolated package and check CLI, web assets and HTTP MCP
        run: |
          dotnet tool install Piston --version "$VERSION" --tool-path "$RUNNER_TEMP/piston-tool" \
            --source "$PWD/packages" --no-cache
          python3 .github/scripts/smoke-tool.py "$RUNNER_TEMP/piston-tool/piston"
      - uses: actions/upload-artifact@v4
        with:
          name: piston-nuget-tool
          path: packages/*.nupkg
          if-no-files-found: error
      - name: Attach tool package to GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" packages/*.nupkg

  publish:
    needs: package
    if: github.event_name == 'push' || inputs.publish_to_nuget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: piston-nuget-tool
          path: packages
      - name: Validate publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the NUGET_USER variable and configure the NuGet Trusted Publisher for release.yml and environment nuget."
            exit 1
          fi
      - name: Obtain short-lived NuGet credentials
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish tool to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "packages/*.nupkg" --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"
      - name: Verify public package and dnx MCP after indexing
        env:
          PISTON_PACKAGES: packages
        run: dotnet run build.cs -- smoke-public
