name: Release tool

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: "Ship a stable release to NuGet.org (otherwise only validate the package)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: piston-release
  queue: max

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  context:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      kind: ${{ steps.source.outputs.kind }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: release-tooling
      - name: Select the tested source commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.sha }}
          PUBLISH_MANUAL: ${{ inputs.publish_to_nuget }}
        run: |
          if [ -z "$PUBLISH_MANUAL" ]; then
            PUBLISH_MANUAL=false
          fi
          python3 release-tooling/.github/scripts/release_publish.py context \
            --event-name "$EVENT_NAME" --ref "$GITHUB_REF" --workflow-sha "$WORKFLOW_SHA" \
            --event-file "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY" --manual-publish "$PUBLISH_MANUAL"

  test:
    needs: context
    if: needs.context.outputs.kind == 'stable'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.context.outputs.source_sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build Piston.slnx -c Release
      - run: dotnet test Piston.slnx -c Release --no-build

  distribution:
    name: Distribution (${{ matrix.os }})
    needs: context
    if: needs.context.outputs.kind == 'stable'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.context.outputs.source_sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet run build.cs -- smoke-distribution

  package:
    needs: [context, test, distribution]
    if: >-
      !cancelled() && needs.context.result == 'success' &&
      (needs.context.outputs.kind == 'dev' ||
       (needs.test.result == 'success' && needs.distribution.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      reused: ${{ steps.prepare.outputs.reused }}
      artifact: ${{ steps.prepare.outputs.artifact }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: release-tooling
      - name: Check out the tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Reserve or reuse the calendar version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
          RELEASE_KIND: ${{ needs.context.outputs.kind }}
          PUBLISH: ${{ needs.context.outputs.publish }}
        run: |
          args=(--source-dir "$GITHUB_WORKSPACE/source" --source-sha "$SOURCE_SHA" \
            --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --kind "$RELEASE_KIND")
          if [ "$PUBLISH" != "true" ]; then
            args+=(--preview)
          fi
          python3 release-tooling/.github/scripts/release_publish.py prepare "${args[@]}"
          echo "artifact=piston-nuget-tool-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Pack framework-dependent tool
        working-directory: source
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
        run: |
          dotnet pack src/Piston/Piston.csproj -c Release "-p:Version=$VERSION" \
            "-p:RepositoryCommit=$SOURCE_SHA" -p:RepositoryType=git -o "$GITHUB_WORKSPACE/packages"
      - name: Check package contents
        working-directory: source
        env:
          PISTON_PACKAGES: ${{ github.workspace }}/packages
        run: dotnet run build.cs -- check-package
      - name: Install isolated package and check CLI, web assets and HTTP MCP
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          dotnet tool install Piston --version "$VERSION" --tool-path "$RUNNER_TEMP/piston-tool" \
            --source "$GITHUB_WORKSPACE/packages" --no-cache
          tool="$RUNNER_TEMP/piston-tool/piston"
          if cmp -s source/.github/scripts/smoke-tool.py release-tooling/.github/scripts/smoke-tool.py; then
            python3 release-tooling/.github/scripts/smoke-tool.py "$tool" "$VERSION"
          else
            python3 source/.github/scripts/smoke-tool.py "$tool"
            python3 release-tooling/.github/scripts/smoke-tool.py "$tool" "$VERSION" --version-only
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact }}
          path: packages/*.nupkg
          if-no-files-found: error

  publish:
    needs: [context, package]
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: release-tooling
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: packages
      - name: Validate publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set NUGET_USER and configure the NuGet Trusted Publisher for release.yml and environment nuget."
            exit 1
          fi
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Reconcile an earlier publication
        id: reconcile
        env:
          VERSION: ${{ needs.package.outputs.version }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
          REUSED: ${{ needs.package.outputs.reused }}
          ARTIFACT: ${{ needs.package.outputs.artifact }}
        run: |
          python3 release-tooling/.github/scripts/release_publish.py reconcile \
            --package "packages/Piston.$VERSION.nupkg" --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" --reused "$REUSED" \
            --artifact "$ARTIFACT" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Publish tool to NuGet.org
        if: steps.reconcile.outputs.push == 'true'
        env:
          VERSION: ${{ needs.package.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "packages/Piston.$VERSION.nupkg" --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"

  verify-public:
    needs: [context, package, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: release-tooling
      - name: Check out the tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          path: source
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: packages
      - name: Verify public package and dnx MCP after indexing
        working-directory: source
        env:
          PISTON_PACKAGES: ${{ github.workspace }}/packages
        run: dotnet run build.cs -- smoke-public
      - name: Verify the public package matches the reserved source and artifact
        env:
          VERSION: ${{ needs.package.outputs.version }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
        run: |
          python3 release-tooling/.github/scripts/release_publish.py verify-package \
            --package "packages/Piston.$VERSION.nupkg" --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY"

  github-release:
    needs: [context, package, publish, verify-public]
    if: needs.context.outputs.kind == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: release-tooling
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: packages
      - name: Create or verify the stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
        run: |
          python3 release-tooling/.github/scripts/release_publish.py github-release \
            --package "packages/Piston.$VERSION.nupkg" --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY"
