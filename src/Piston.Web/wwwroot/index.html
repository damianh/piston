<!DOCTYPE html>
<html lang="en">

<head>

    <base href="/" />
    <script src="js/theme.js"></script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/tailwind.css" />

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />

    <script src="js/splitter.js"></script>
